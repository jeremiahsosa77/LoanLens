version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: loanlens_db_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loanlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanlens_password}
      POSTGRES_DB: ${POSTGRES_DB:-loanlens_db}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loanlens_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanlens_backend_dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loanlens_user}:${POSTGRES_PASSWORD:-loanlens_password}@db:5432/${POSTGRES_DB:-loanlens_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key}
      FLASK_ENV: development
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        sleep 5 &&
        python app.py
      "

volumes:
  postgres_data_dev:
