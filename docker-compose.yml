version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: loanlens_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loanlens_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanlens_password}
      POSTGRES_DB: ${POSTGRES_DB:-loanlens_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loanlens_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanlens_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loanlens_user}:${POSTGRES_PASSWORD:-loanlens_password}@db:5432/${POSTGRES_DB:-loanlens_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key}
      FLASK_ENV: ${FLASK_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "
        flask db upgrade 2>/dev/null || flask db init && flask db migrate -m 'Initial migration' && flask db upgrade &&
        python app.py
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loanlens_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  postgres_data:
